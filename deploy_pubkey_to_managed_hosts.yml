---
- name: SSH publikus kulcs szétterítése a célgépekre
  hosts: all
  gather_facts: false
  become: true  # Root jog szükséges a felhasználó kulcsának módosításához

  vars:
    ssh_user: "mcs"
    # Itt adjuk meg a tiszta szöveges jelszót
    ssh_password_raw: "root123"
    # Itt add meg a nyilvános kulcsot
    public_key: "ssh-rsa  mcs@://example.com"

  tasks:
    - name: Ellenőrizzük, hogy létezik-e az mcs felhasználó és dinamikusan hasheljük a jelszót
      ansible.builtin.user:
        name: "{{ ssh_user }}"
        # A password_hash szűrő a háttérben biztonságos SHA-512 hasht készít egyedi salttal
        password: "{{ ssh_password_raw | password_hash('sha512') }}"
        state: present
        shell: /bin/bash

    - name: SSH kulcs hozzáadása az authorized_keys fájlhoz
      ansible.posix.authorized_key:
        user: "{{ ssh_user }}"
        state: present
        key: "{{ public_key }}"
