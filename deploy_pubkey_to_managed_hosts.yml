---
- name: SSH publikus kulcs szétterítése a célgépekre
  hosts: all
  gather_facts: false
  become: true  # Root jog szükséges a felhasználó kulcsának módosításához

  vars:
    ssh_user: "mcs"
    # A "root123" jelszó SHA-512-es hash formátuma salt-tal
    ssh_password: "$6$rounds=656000$randomsalt12345$5Xh.uV4kC8sMms96Fv3y27G0bM73oR0K0N5Sndd5rDbaG5lF713g6B5gC9.U7m8z6/1YhG4Ie/XpWzS/P1f80/"
    # Itt add meg a nyilvános kulcsot
    public_key: "ssh-rsa  mcs@rhel9-02.example.com"

  tasks:
    - name: Ellenőrizzük, hogy létezik-e a megadott felhasználó (ha nem létezik, akkor létrehozzuk) és beállítjuk a jelszavát
      ansible.builtin.user:
        name: "{{ ssh_user }}"
        password: "{{ ssh_password }}"
        state: present
        shell: /bin/bash

    - name: SSH kulcs hozzáadása az authorized_keys fájlhoz
      ansible.posix.authorized_key:
        user: "{{ ssh_user }}"
        state: present
        key: "{{ public_key }}"
