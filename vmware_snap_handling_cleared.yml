#version 0.99
#by JunkertF

INV_GRP="$1";
ANS=`which ansible-playbook`;
INVENTORY="/home/ansible/vmware_snap/inventory";
ANSYML="/home/ansible/vmware_snap/SNAP_List.yml"
DT=`echo $(date +%Y.%m.)`;
LOGD="$(pwd)/log";
LOGF="$LOGD/SNAP_List_$INV_GRP.$DT.log";

if [ -n "$INV_GRP" ]; then
	INVGNAMECNT=`grep -w $1 $INVENTORY | wc -l`;
	case $INVGNAMECNT in
		0)
			echo "Non existent Inventory Group NAME!!!"
			exit 98
			;;
		1)
			$ANS -i $INVENTORY $ANSYML -e "vmsnap_hosts=$INV_GRP" | tee $LOGF
			echo "Existing VMWare Snapshots for VM's:"
			grep -A 30 "invocation" $LOGF | grep -wE "name|snapshot_name"
			;;
		2)
			echo "Inventory Group Name is multiple time in Inventory, must CHECK!"
			exit 97
			;;

	esac


else #ERROR 
	echo "Inventory Group not given as parameter!";
	exit 99;

fi

