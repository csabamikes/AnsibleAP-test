- name: Linux snapshot lista
  hosts: localhost
  connection: local
  gather_facts: no
  become: false
  

  vars:

    target_hosts: "{{ vmsnap_hosts }}"
    vmware_datacenter: "MAVIR"
    snapshot_name: "2025.05. update"
    snapshot_desc: "Linux frissites elott, torolhet 1 het mulva"


  vars_prompt:

    - name: vcenter_username
      prompt: "VMware username"
      private: no

    - name: vcenter_password
      prompt: "What is your password"


  tasks:
    - name: Debug
      loop: "{{ query('inventory_hostnames', target_hosts) }}"
      debug:
        msg: "List VM Snapshot for {{ item }} on VCenter SRV: {{ hostvars[item].vcenter_name }}"

    - name: LIST VMs snap
      vmware_guest_snapshot_info:
        datacenter: "{{ vmware_datacenter }}"
        hostname: "{{ hostvars[item].vcenter_name }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: False
        name: "{{ item }}"
        folder: "/"
      delegate_to: localhost
      loop: "{{ query('inventory_hostnames', target_hosts) }}"
      register: res

    - name: Display
      debug:
        var: res

- name: Linux snapshot torles
  hosts: localhost
  connection: local
  gather_facts: no
  become: false
  

  vars:

    target_hosts: "{{ vmsnap_hosts }}"
    vmware_datacenter: "MAVIR"
    snapshot_name: "{{ vmsnap_snname }}"


  vars_prompt:

    - name: vcenter_username
      prompt: "VMware username"
      private: no

    - name: vcenter_password
      prompt: "What is your password"


  tasks:
    - name: Debug
      loop: "{{ query('inventory_hostnames', target_hosts) }}"
      debug:
        msg: "Delete VM Snapshot {{ snapshot_name }} for {{ item }} on VCenter SRV: {{ hostvars[item].vcenter_name }}"

    - name: Delete VMs snap
      vmware_guest_snapshot:
        datacenter: "{{ vmware_datacenter }}"
        hostname: "{{ hostvars[item].vcenter_name }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: False
        name: "{{ item }}"
        folder: "/"
        state: absent
        snapshot_name: "{{ snapshot_name }}"
      delegate_to: localhost
      loop: "{{ query('inventory_hostnames', target_hosts) }}"
      register: res

    - name: Display result
      debug:
        var: res

