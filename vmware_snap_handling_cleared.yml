#!/bin/bash
#Listafile-generálással és ellenorzesekkel kiegesziteni
# Not complete! Must check commands!

INV_GRP="$1";
ANS=`which ansible-playbook`;
INVENTORY="/home/ansible/vmware_snap/inventory";
ANSYML="/home/ansible/vmware_snap/SNAP_Delete.yml";
SNAPNAME="$2";

DT=`echo $(date +%Y.%m.)`;
LOGD="$(pwd)/log";
LOGF="$LOGD/SNAP_Delete_$INV_GRP.$DT.log";

if [ ! -n "$SNAPNAME" ]; then

        echo "VMware Snapshot Name not given as parameter!";
        exit 99;


fi


if [ -n "$INV_GRP" ]; then
        INVGNAMECNT=`grep -w $1 $INVENTORY | wc -l`;
        case $INVGNAMECNT in
                0)
                        echo "Non existent Inventory Group NAME!!!"
                        exit 98
                        ;;
                1)
                        $ANS -i $INVENTORY $ANSYML -e "vmsnap_hosts=$INV_GRP vmsnap_snname=$SNAPNAME" | tee $LOGF
                        #include SNAP_List.yml... ???
                        #echo "Existing VMWare Snapshots for VM's:"
                        #grep -w -A 17 "snapshots" $LOGF | grep "name" | grep -vE "username|hostname"
			grep -w --before-context=11 -v "absent" $LOGF | grep name | grep -vE "username|hostname|new_snapshot_name|name_match"
                        ;;
                2)
                        echo "Inventory Group Name is multiple time in Inventory, must CHECK!"
                        exit 97
                        ;;

        esac


else #ERROR 
        echo "Inventory Group not given as parameter!";
        exit 99;

fi

exit 0;

